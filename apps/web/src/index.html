<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>مِرحال | حياتك، رحلتك</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7165" />
    <script>
      try {
        const preference = localStorage.getItem('lq-theme');
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14211e' : '#0e7165';
      } catch {
        /* Theme preference is optional; the application applies a safe default. */
      }
    </script>
    <meta
      name="description"
      content="مِرحال يساعدك على اختيار خطوتك التالية، ومتابعة تقدمك، والنمو وفق وتيرتك."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="mirhal-mark.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      .initial-loading { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1rem; background: #f7faf8; color: #24534b; font: 14px system-ui, sans-serif; }
      .dark .initial-loading { background: #14211e; color: #d8eee8; }
      .initial-loading img { width: 64px; height: 64px; animation: initial-pulse 1.6s ease-in-out infinite; }
      @keyframes initial-pulse { 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { .initial-loading img { animation: none; } }
    </style>
  </head>
  <body>
    <lq-root><div class="initial-loading" role="status" aria-label="جارٍ تحميل مِرحال / Loading MIRHAL"><img src="mirhal-mark.svg" alt="" /><span>مِرحال · MIRHAL</span></div></lq-root>
  </body>
</html>
